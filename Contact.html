<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Information</title>
<style>
  :root {
    --royal-maroon: #5C1A1B;
    --deep-maroon: #3D1010;
    --gold: #C89B3C;
    --pale-gold: #E8D5A8;
    --ivory: #FBF7EE;
    --charcoal: #2B2320;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--ivory);
    color: var(--charcoal);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: #ffffff;
    border-radius: 6px;
    max-width: 420px;
    width: 100%;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(61, 16, 16, 0.12);
    border: 1px solid rgba(92, 26, 27, 0.1);
  }

  .card-header {
    background: linear-gradient(160deg, var(--royal-maroon) 0%, var(--deep-maroon) 100%);
    color: var(--pale-gold);
    padding: 40px 32px 32px;
    text-align: center;
  }

  .avatar {
    width: 68px;
    height: 68px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 24px;
    color: var(--gold);
    background: radial-gradient(circle, rgba(200,155,60,0.1), transparent 70%);
  }

  .card-header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin-bottom: 4px;
    color: var(--ivory);
  }

  .card-header p {
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .card-body {
    padding: 32px;
  }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid rgba(92, 26, 27, 0.08);
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease;
  }

  .contact-row:last-child {
    border-bottom: none;
  }

  .contact-row:hover {
    transform: translateX(4px);
  }

  .icon {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--ivory);
    border: 1px solid rgba(92, 26, 27, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--royal-maroon);
  }

  .contact-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .contact-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
  }

  .contact-value {
    font-size: 15.5px;
    color: var(--charcoal);
    font-weight: 500;
    word-break: break-word;
  }

  .card-footer {
    text-align: center;
    padding: 18px 32px 28px;
    font-size: 12px;
    color: #a08d78;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="avatar">J</div>
      <h1>Juliana Pelson</h1>
      <p>Contact Details</p>
    </div>

    <div class="card-body">
      <a class="contact-row" href="tel:650337712">
        <div class="icon">&#128222;</div>
        <div class="contact-text">
          <span class="contact-label">Phone</span>
          <span class="contact-value">650 337 712</span>
        </div>
      </a>

      <a class="contact-row" href="mailto:julianapelson@gmail.com">
        <div class="icon">&#9993;</div>
        <div class="contact-text">
          <span class="contact-label">Email</span>
          <span class="contact-value">julianapelson@gmail.com</span>
        </div>
      </a>
    </div>

    <div class="card-footer">
      Feel free to reach out anytime
    </div>
  </div>

</body>
</html>
